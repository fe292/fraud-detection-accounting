name: Real OpenML fraud baseline (one-shot experiment)

on:
  push:
    branches: ["chatgpt/leakage-safe-evaluation-20261022"]
    paths: ["scripts/openml_baseline.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-shot-openml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-data-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pandas>=2.0" "scikit-learn>=1.3" "imbalanced-learn>=0.12"
      - name: Download public OpenML creditcard (dataset 1597) and evaluate
        run: |
          python scripts/openml_baseline.py
      - name: Archive reports only (no dataset)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openml-baseline-report
          path: reports/openml_baseline.json
          retention-days: 7
